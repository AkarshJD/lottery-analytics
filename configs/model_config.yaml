# Model hyperparameters and evaluation settings

forecasting:
  prophet:
    seasonality_mode: multiplicative
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: false
    changepoint_prior_scale: 0.05
    seasonality_prior_scale: 10.0
    holidays_prior_scale: 10.0

  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    objective: reg:squarederror
    random_state: 42

  ensemble:
    prophet_weight: 0.6
    xgboost_weight: 0.4

  cv:
    n_splits: 5
    horizon_weeks: 8         # forecast 8 weeks ahead
    gap_weeks: 1             # gap between train and test

  target_mape: 0.08          # 8% MAPE ceiling

  # Game-specific jackpot power transforms and draw days
  # Exponents derived from power regression on historical draw data
  games:
    "Fantasy 5":
      jackpot_exponent: 1.0       # linear relationship
      draw_days: [0, 1, 2, 3, 4, 5]   # daily (Mon-Sat)
      use_prior_jackpot: false
    "Mega Millions":
      jackpot_exponent: 1.66      # super-linear
      draw_days: [1, 4]           # Tuesday, Friday
      use_prior_jackpot: true
    "Powerball":
      jackpot_exponent: 1.61      # super-linear
      draw_days: [0, 2, 5]        # Monday, Wednesday, Saturday
      use_prior_jackpot: false
    "The Pick":
      jackpot_exponent: 0.88      # near-linear
      draw_days: [2, 5]           # Wednesday, Saturday
      use_prior_jackpot: false
    "Triple Twist":
      jackpot_exponent: 0.33      # sub-linear, diminishing returns
      draw_days: [0, 1, 2, 3, 4, 5]   # daily (Mon-Sat)
      use_prior_jackpot: false

segmentation:
  kmeans:
    n_clusters: 5
    random_state: 42
    n_init: 20
    max_iter: 500

  dbscan:
    eps: 0.5
    min_samples: 50
    metric: euclidean

  scaler: standard           # StandardScaler before clustering

anomaly_detection:
  isolation_forest:
    n_estimators: 200
    contamination: 0.05      # ~5% of retailers expected anomalous
    max_samples: auto
    random_state: 42
    bootstrap: false

  flag_threshold: 0.6        # anomaly score above this gets flagged
